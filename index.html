<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>byro ist umgezogen</title>
<link rel="canonical" href="https://byro.info/">
<!-- GitHub Pages cannot send HTTP 301, so redirect from the page itself.
     byro.info/ picks the visitor's language on its own. -->
<meta http-equiv="refresh" content="0; url=https://byro.info/">
<script>location.replace("https://byro.info/");</script>
<link rel="icon" href="/byro-logo.svg" type="image/svg+xml">
<style>
  /* Colors taken from https://byro.info/assets/css/site.css */
  :root {
    --brand: #005da5;
    --link: #005da5;
    --bg: #ffffff;
    --fg: #212529;
    --fg-muted: #56616b;
    --h1-weight: 750;
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --link: #74b5e7;
      --bg: #212529;
      --fg: #dae0e4;
      --fg-muted: #adb5bd;
      --h1-weight: 700;
    }
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    box-sizing: border-box;
    background: var(--bg);
    color: var(--fg);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.6;
    text-align: center;
  }

  main {
    max-width: 36rem;
  }

  img {
    width: 7.5rem;
    height: auto;
    margin-bottom: 1.5rem;
  }

  h1 {
    margin: 0 0 0.75rem;
    font-size: clamp(1.75rem, 1.2rem + 3vw, 3.25rem);
    font-weight: var(--h1-weight);
    line-height: 1.2;
    letter-spacing: -0.02em;
  }

  p {
    margin: 0 0 1.5rem;
    color: var(--fg-muted);
    font-size: clamp(1.1rem, 1rem + 0.4vw, 1.25rem);
  }

  a {
    display: inline-block;
    padding: 0.65rem 1.35rem;
    border: 2px solid var(--brand);
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    font-weight: 600;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  a:focus-visible {
    outline: 3px solid var(--link);
    outline-offset: 3px;
  }
</style>
</head>
<body>
<main>
  <img src="/byro-logo.svg" alt="" width="120" height="120">
  <h1>byro ist umgezogen</h1>
  <p>Die Webseite von byro findest du jetzt unter byro.info.</p>
  <a href="https://byro.info/">Weiter zu byro.info</a>
</main>
</body>
</html>
